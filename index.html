<html>
       <title>Ticket Booking</title>
       <style>
        body {
    background: white;
}
* {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background-color: #eeebe5;
                color: #111314;
                font-family: Georgia, 'Times New Roman', serif;
            }

            form {
                background-color: rgb(21, 21, 73);
                padding: 2px;
                margin: 0;
                position: sticky;
                top: 0;
                z-index: 1000;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            }

            nav a:hover {
                text-decoration: underline;
            }

            nav a {
                color: aliceblue;
                text-align: right;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 20px;
                font-weight: bold;
            }

            nav {
                display: flex;
                align-items: center;
                justify-content: flex-end;
            }

            .site-logo {
                width: 140px;
                height: auto;
                margin-right: auto;
                object-fit: contain;
            }

            .profile-icon img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                object-fit: cover;
                vertical-align: middle;
            }

            .profile-icon img:hover {
                opacity: 0.8;
                cursor: pointer;
            }

       </style>
    <body>
        <form>
            <div>
                <nav>
                    <img src="logo.png" alt="Magi Travels Logo" class="site-logo">
                    <a href="home.html#home" style="margin: 20px;"> Home</a>
                    <a href="home.html#aboutus" style="margin: 20px;">About</a>
                    <a href="booking.html" style="margin: 20px;">Booking</a>
                    <a href="home.html#contactus" style="margin: 20px;">Contact</a>
                    <a href="login.html" class="profile-icon" style="margin: 20px;"><img src="avater.jpg"></a>
                </nav>
            </div>
        </form>
        <center>
        <form action="login.html" id="registrationForm" style="background-color: rgb(220, 246, 248); margin-top: 130px;  border: 2px solid black; border-radius: 0; padding: 20px; width: 300px; box-shadow: 0 9px 38px rgba(0, 0, 0, 0.6); ">
             
             <h1>New Registration</h1>
            <table>
        <tr>
            <td> <label> Name</label></td>
            <td><input type="text" id="name" required></td>
        </tr>
            <td> <label>Date of Birth</label></td>
            <td> <input type="date" id="dob" required></td>
        <tr>
           <td><label> Gender </label></td>
            <td>
                <input type="radio" name="gender" value="Male" required> Male
                <input type="radio" name="gender" value="Female" required> Female
                <input type="radio" name="gender" value="Other"> Other
            </td>
        </tr>
        <tr>
            <td><label> Email </label></td>
            <td><input type="email" id="email" required></td>
        </tr>
        <tr>
            <td><label>Username</label></td>
            <td><input type="text" id="username" required> </td>
        </tr>
        <tr>
            <td><label> Password</label></td>
            <td><input type="password" id="password" required></td>
        </tr>
        <tr>
            <td><label>Confirm Password</label></td>
            <td><input type="password" id="password" required></td>
        </tr>
        <tr>
            <td><label>Address</label></td>
            <td><input type="text" id="address" required></td>
        </tr>
        <tr>
           <td>City</td>
        <td>
            <select name="city" required>
                <option>Select city</option>
                <option>Chennai</option>
                <option>Bangalore</option>
                <option>Hyderabad</option>
                <option>Mumbai</option>
                <option>Delhi</option>
            </select>
        </td>
        </tr>
        <tr>
            <td>State</td>
        <td>
            <select name="state"  required>
                <option>Select State</option>
                <option>Tamil Nadu</option>
                <option>Karnataka</option>
                <option>Kerala</option>
                <option>Andhra Pradesh</option>
                <option>Telangana</option>
                <option>Maharashtra</option>
            </select>
        </td>
        </tr>
        <tr>
            <td><label>Pincode</label></td>
            <td><input type="text" name="pincode" maxlength="6" required></td>
        </tr>
        <tr> <td colspan="" style="text-align: center;"></td></tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                 
                <button type="submit" style="background-color: hwb(212 33% 40%);">Submit</button></td>
           

        </tr>
        
            
        </table>
       </form>
       </center>
    </body>
</html>
